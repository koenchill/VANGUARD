apiVersion: 1
providers:
  - name: mission-bi
    orgId: 1
    folder: Mission BI
    folderUid: mission-bi
    type: file
    disableDeletion: true
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards/mission-bi
  - name: infra-monitoring
    orgId: 1
    folder: Infra Monitoring
    folderUid: infra-monitoring
    type: file
    disableDeletion: true
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards/infra
