apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: agentic-app
  labels:
    app: inference-api
    workload: inference
    app.kubernetes.io/part-of: vanguard
  annotations:
    vanguard.ai/resource-contract: infra/docker/resources/inference.yaml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-api
  template:
    metadata:
      labels:
        app: inference-api
        workload: inference
        workload-tier: inference-gpu
    spec:
      nodeSelector:
        karpenter.sh/nodepool: inference-gpu
      tolerations:
      - key: workload-tier
        operator: Equal
        value: inference-gpu
        effect: NoSchedule
      containers:
      - name: inference-api
        image: vanguard/inference:phase2
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 8888
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 2000m
            memory: 8Gi
            ephemeral-storage: 20Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: 8000m
            memory: 32Gi
            ephemeral-storage: 20Gi
            nvidia.com/gpu: '1'
        env:
        - name: VANGUARD_WORKLOAD
          value: inference
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inference-api
  namespace: agentic-app
  labels:
    app: inference-api
spec:
  selector:
    app: inference-api
  ports:
  - name: http
    port: 8000
    targetPort: http
