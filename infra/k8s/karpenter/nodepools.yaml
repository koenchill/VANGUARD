apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: inference-gpu
spec:
  amiFamily: AL2
  role: vanguard-karpenter-node
  subnetSelectorTerms:
  - tags:
      karpenter.sh/discovery: vanguard
  securityGroupSelectorTerms:
  - tags:
      karpenter.sh/discovery: vanguard
  tags:
    Name: vanguard-inference-gpu
    workload-tier: inference-gpu
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: inference-gpu
spec:
  template:
    metadata:
      labels:
        workload-tier: inference-gpu
    spec:
      requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values:
        - on-demand
      - key: karpenter.k8s.aws/instance-family
        operator: In
        values:
        - g5
        - p4d
      - key: kubernetes.io/arch
        operator: In
        values:
        - amd64
      taints:
      - key: workload-tier
        value: inference-gpu
        effect: NoSchedule
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: inference-gpu
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30m
---
